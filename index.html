<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scacchi Training</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    
    <!-- CSS di Chessboard.js -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
</head>
<body>

    <div class="container">
        <h2>Studio Posizioni</h2>
        
        <!-- Scacchiera -->
        <div id="myBoard" style="width: 100%"></div>
        
        <!-- Controlli Base -->
        <div class="controls-group">
            <button id="startBtn">Base</button>
            <button id="clearBtn">Svuota</button>
            <button id="getFenBtn">Estrai FEN</button>
        </div>

        <p id="currentFenDisplay" class="fen-text"></p>

        <!-- 1. Caricamento da FEN -->
        <div class="feature-section">
            <label>Carica da stringa FEN</label>
            <div class="input-row">
                <input type="text" id="fenInput" placeholder="Incolla il FEN qui...">
                <button id="loadFenBtn">Carica</button>
            </div>
        </div>

        <!-- 2. Aperture e Puzzle Preimpostati -->
        <div class="feature-section">
            <label>Seleziona un'apertura o finale</label>
            <div class="input-row">
                <select id="puzzleSelect">
                    <option value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1">Posizione Iniziale</option>

                    <optgroup label="Aperture al Re (1. e4)">
                        <option value="r1bqkbnr/pppp1ppp/2n5/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3">Partita Spagnola (Ruy Lopez)</option>
                        <option value="r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3">Partita Italiana</option>
                        <option value="rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2">Difesa Siciliana</option>
                        <option value="rnbqkbnr/pppp1ppp/4p3/8/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2">Difesa Francese</option>
                        <option value="rnbqkbnr/pp1ppppp/2p5/8/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2">Difesa Caro-Kann</option>
                        <option value="r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3">Difesa Philidor</option>
                        <option value="r1bqkb1r/pppp1ppp/2n2n2/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4">Difesa dei Due Cavalli</option>
                    </optgroup>

                    <optgroup label="Aperture alla Donna (1. d4)">
                        <option value="rnbqkbnr/ppp1pppp/8/3p4/2PP4/8/PP2PPPP/RNBQKBNR b KQkq - 0 2">Gambetto di Donna</option>
                        <option value="rnbqkbnr/pp2pppp/2p5/3p4/2PP4/8/PP2PPPP/RNBQKBNR w KQkq - 0 3">Difesa Slava</option>
                        <option value="rnbqkb1r/pppppp1p/5np1/8/2PP4/8/PP2PPPP/RNBQKBNR w KQkq - 0 3">Difesa Est-Indiana</option>
                        <option value="rnbqk2r/pppp1ppp/4pn2/8/1bPP4/2N5/PP2PPPP/R1BQKBNR w KQkq - 2 4">Difesa Nimzo-Indiana</option>
                        <option value="rnbqkb1r/pppp1ppp/4pn2/8/2PP4/8/PP2PPPP/RNBQKBNR w KQkq - 0 3">Difesa Ovest-Indiana</option>
                        <option value="rnbqkbnr/ppp1pp1p/8/3p2p1/3P4/8/PPP1PPPP/RNBQKBNR w KQkq - 0 2">Difesa Olandese</option>
                    </optgroup>

                    <optgroup label="Altre Aperture">
                        <option value="rnbqkbnr/pppppppp/8/8/2P5/8/PP1PPPPP/RNBQKBNR b KQkq - 0 1">Apertura Inglese (1. c4)</option>
                        <option value="rnbqkbnr/pppppppp/8/8/8/5N2/PPPPPPPP/RNBQKB1R b KQkq - 0 1">Apertura Réti (1. Cf3)</option>
                        <option value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1">Sistema London (Base)</option>
                    </optgroup>
                    
                    <optgroup label="Finali di Allenamento">
                        <option value="8/8/8/8/8/4k3/4P3/4K3 w - - 0 1">Re e Pedone vs Re</option>
                        <option value="8/8/8/8/8/8/3k4/R3K2R w KQ - 0 1">Matto con Torri (La Scala)</option>
                        <option value="8/8/8/8/8/3k4/8/Q3K3 w - - 0 1">Re e Donna vs Re</option>
                        <option value="8/8/8/8/8/3k4/8/R3K3 w - - 0 1">Re e Torre vs Re</option>
                    </optgroup>
                </select>
                <button id="loadPuzzleBtn">Vai</button>
            </div>
        </div>

        <!-- 3. Database Locale -->
        <div class="feature-section">
            <label>Salva la posizione attuale</label>
            <div class="input-row">
                <input type="text" id="saveNameInput" placeholder="Nome (es. Finale Tattico)...">
                <button id="savePosBtn">Salva</button>
            </div>
            
            <h4 style="margin-top: 15px; margin-bottom: 10px; text-align: left; color: #2c3e50;">Posizioni Salvate:</h4>
            <div id="savedPositionsList" class="saved-list">
                <!-- Qui verranno generate le posizioni salvate -->
            </div>
        </div>
    </div>

    <!-- JQuery e Chessboard.js -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
